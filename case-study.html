<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="0; url=https://ceharless.github.io/case-study-search.html">
  <title>Case Study: Modernizing Search — From Monolith Pain to Safe, Scalable Delivery</title>

  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Portfolio" />
  <link rel="manifest" href="/site.webmanifest" />

  <style>
    :root {
      --bg: #0b1220;
      --panel: rgba(255, 255, 255, 0.06);
      --panel2: rgba(255, 255, 255, 0.09);
      --text: rgba(255, 255, 255, 0.92);
      --muted: rgba(255, 255, 255, 0.72);
      --faint: rgba(255, 255, 255, 0.55);
      --line: rgba(255, 255, 255, 0.14);
      --accent: #6ee7ff;
      --accent2: #a78bfa;
      --good: #34d399;
      --warn: #fbbf24;
      --bad: #fb7185;

      --radius: 16px;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--sans);
      color: var(--text);
      background:
        radial-gradient(1000px 600px at 15% 10%, rgba(167, 139, 250, 0.22), transparent 60%),
        radial-gradient(900px 500px at 70% 0%, rgba(110, 231, 255, 0.18), transparent 60%),
        radial-gradient(1100px 700px at 60% 85%, rgba(52, 211, 153, 0.12), transparent 60%),
        var(--bg);
      background-repeat: no-repeat;
      background-color: black;
      line-height: 1.55;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    .wrap {
      margin: 0 auto;
      padding: 2rem;
    }

    header {
      position: relative;
      padding: 2.25rem 2rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.04));
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    header::after {
      content: "";
      position: absolute;
      inset: -1px;
      background:
        radial-gradient(600px 250px at 15% 30%, rgba(110, 231, 255, 0.18), transparent 60%),
        radial-gradient(500px 240px at 80% 10%, rgba(167, 139, 250, 0.18), transparent 60%);
      pointer-events: none;
      filter: blur(0.2px);
      opacity: 0.8;
    }

    .hero {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1.25fr 0.75fr;
      gap: 1.25rem;
      align-items: start;
    }

    h1 {
      margin: 0 0 .25rem 0;
      font-size: clamp(1.6rem, 2.6vw, 2.4rem);
      letter-spacing: -0.02em;
    }

    .content {
      color: var(--muted);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Case Study: Modernizing Search</h1>
        <p class="content">
          This page has been moved. The new page is located at
          <a
            href="https://ceharless.github.io/case-study-search.html">https://ceharless.github.io/case-study-search.html</a>.
          You will be automatically redirected.
        </p>
      </div>
    </header>

  </div>

</body>

</html>
